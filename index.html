<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#071422">
  <title>Market Watch</title>
  <link rel="icon" href="assets/bayer-cross.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <header>
      <div class="brand">
        <img class="logo" src="assets/bayer-cross.svg" alt="Bayer">
        <h1>Market Watch</h1>
      </div>
      <div class="clocks">
        <section class="clock" data-tz="America/New_York" data-market="nyse">
          <div class="city">Whippany, NJ</div>
          <div class="time">--:--</div>
          <div class="badge closed">NYSE</div>
        </section>
        <section class="clock" data-tz="America/Chicago" data-market="nyse">
          <div class="city">Rogers, AR</div>
          <div class="time">--:--</div>
          <div class="badge closed">NYSE</div>
        </section>
        <section class="clock" data-tz="Europe/Berlin" data-market="xetra">
          <div class="city">Leverkusen</div>
          <div class="time">--:--</div>
          <div class="badge closed">XETRA</div>
        </section>
        <section class="clock" data-tz="Europe/Zurich" data-market="xetra">
          <div class="city">Basel</div>
          <div class="time">--:--</div>
          <div class="badge closed">XETRA</div>
        </section>
      </div>
    </header>

    <section class="quotes" aria-label="Quotes">
      <article class="card" data-quote="bayn">
        <div class="q-head">
          <img class="q-mark q-mark-bayer" src="assets/bayer-cross.svg" alt="">
          <div class="q-name">BAYER AG</div>
          <div class="q-venue">BAYN · Frankfurt</div>
        </div>
        <div class="q-price">—</div>
        <div class="q-change"><span class="q-chg">—</span><span class="at-close" hidden>At close</span></div>
        <div class="spark"></div>
      </article>
      <article class="card" data-quote="bayry">
        <div class="q-head">
          <img class="q-mark q-mark-bayer" src="assets/bayer-cross.svg" alt="">
          <div class="q-name">BAYER ADR</div>
          <div class="q-venue">BAYRY · OTC</div>
        </div>
        <div class="q-price">—</div>
        <div class="q-change"><span class="q-chg">—</span><span class="at-close" hidden>At close</span></div>
        <div class="spark"></div>
      </article>
      <article class="card" data-quote="wmt">
        <div class="q-head">
          <img class="q-mark q-mark-spark" src="assets/walmart-spark.svg" alt="">
          <div class="q-name">WALMART</div>
          <div class="q-venue">WMT · NASDAQ</div>
        </div>
        <div class="q-price">—</div>
        <div class="q-change"><span class="q-chg">—</span><span class="at-close" hidden>At close</span></div>
        <div class="spark"></div>
      </article>
    </section>

    <section class="headlines">
      <div class="hl-head">
        <h2 id="hl-title">HEADLINES · BAYER</h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="bayer" class="active">Bayer</button>
          <button type="button" role="tab" data-tab="walmart">Walmart</button>
          <button type="button" role="tab" data-tab="top">Top Stories</button>
        </div>
      </div>
      <ul class="hl-list" id="hl-list"></ul>
    </section>

    <footer>
      <div id="ticker"></div>
      <div id="status">Quotes delayed 15 min</div>
    </footer>
  </div>
  <script src="js/market-hours.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
